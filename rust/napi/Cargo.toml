[package]
name = "text-formatter-napi"
version = "0.2.0"
authors = ["Dima Chernyshev <dimcher@gmail.com>"]
license = "MIT"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
text-formatter-core = { path = "../core" }

[build-dependencies]
napi-build = "2"
