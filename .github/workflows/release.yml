name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, flags: --use-napi-cross }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, flags: --use-napi-cross }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npx napi build --platform --release --target ${{ matrix.target }} ${{ matrix.flags }} --manifest-path rust/napi/Cargo.toml --output-dir . --js binding.js --dts binding.d.ts
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: '*.node'
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: npx napi artifacts --output-dir artifacts
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
